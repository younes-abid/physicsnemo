hydra:
    job:
          chdir: false
          name: custom_regression
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, training, and validation
defaults:

    - dataset: custom 
    # The dataset type for training.
    # Accepted values:
    #   `gefs_hrrr`: full GEFS-HRRR dataset for continental US.
    #   `hrrr_mini`: smaller HRRR dataset (continental US), for fast experiments.
    #   `cwb`: full CWB dataset for Taiwan.
    #   `custom`: user-defined dataset. Parameters need to be specified below.

    - model: regression
    # The model type.
    # Accepted values:
    #     `regression`: a regression UNet for deterministic predictions
    #     `lt_aware_ce_regression`: similar to `regression` but with lead time
    #       conditioning
    #     `diffusion`: a diffusion UNet for residual predictions
    #     `patched_diffusion`: a more memory-efficient diffusion model
    #     `lt_aware_patched_diffusion`: similar to `patched_diffusion` but
    #       with lead time conditioning

    - model_size: normal
    # The model size configuration.
    # Accepted values:
    #     `normal`: normal model size
    #     `mini`: smaller model size for fast experiments

    - training: ${model}
    # The base training parameters. Determined by the model type.


# Dataset parameters. Used for `custom` dataset type.
# Modify or add below parameters that should be passed as argument to the
# user-defined dataset class.
dataset:
    data_path: /app/data/custom_data_1/ERA5_wrf_combined_concatenated/custom_concat_train.nc
    # Path to .nc data file
    stats_path: "/app/data/custom_data_1/ERA5_wrf_combined_concatenated/custom_concat_train.json"
    # Path to json stats file
    input_variables: ["t_850", "t_500", "z_850", "z_500", "u_850", "u_500", "v_850", "v_500", "u10", "v10", "t2m", "d2m", "skt", "sp", "tcwv", "tp"] #"sst",
    output_variables: ["T2", "TSK"] #["T2", "U10", "V10", "rain_rate", "SST", "TSK", "Q2", "PSFC"]
    invariant_variables: []  # Optional: leave empty if not used

validation:
    data_path: /app/data/custom_data_1/ERA5_wrf_combined_concatenated/custom_concat_validation.nc
    # Path to .nc data file
    stats_path: ./data/custom_data_1/ERA5_wrf_combined/uae_stats.json
    # Path to json stats file
    input_variables: ["t_850", "t_500", "z_850", "z_500", "u_850", "u_500", "v_850", "v_500", "u10", "v10", "t2m", "d2m", "skt", "sp", "tcwv", "tp"] #"sst",
    output_variables: ["T2", "TSK"]
    invariant_variables: []  # Optional: leave empty if not used

# Training parameters
training:
    hp:
        training_duration: 2000000 # Training duration based on the number of processed samples
        total_batch_size: 16
        batch_size_per_gpu: 2 # Set explicitly to avoid "auto" issues
        lr:  0.0005
        grad_clip_threshold: null # null # 10000.0 # Gradient clipping threshold; set to null to disable
        lr_decay: 0.9
        lr_rampup: 5000
        lr_decay_rate: 50000.0
    perf:
        fp_optimizations: amp-fp32
        # Floating point mode, one of ["fp32", "fp16", "amp-fp16", "amp-bf16"]
        # "amp-{fp16,bf16}" activates Automatic Mixed Precision (AMP) with {float16,bfloat16}
        dataloader_workers: 32
        songunet_checkpoint_level: 0

        use_gpu: true
        num_gpus: -1  # Use all available GPUs
    io:
        regression_checkpoint_path: null
        print_progress_freq: 500
        metric_log_freq: 1
        grad_log_freq: 400
        image_log_freq: 4000
        save_checkpoint_freq: 5000
        save_n_recent_checkpoints: 10
        validation_freq: 500
        validation_steps: 100
        load_optimizer: False
        checkpoint_dir: /app/checkpoints/T2_TSK

# parameters for tensorboard logging
tensorboard:
    log_dir: /app/tensorboard/T2_TSK/regression
    # Directory to store tensorboard logs

# Parameters for wandb logging
wandb:
    mode: offline
    # Configure whether to use wandb: "offline", "online", "disabled"
    results_dir: "/app/wandb/T2_TSK/regression"
    # Directory to store wandb results
    watch_model: false
    # If true, wandb will track model parameters and gradients